[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeburn"
version = "0.1.0"
description = "Stream an ISO straight from a URL to a USB drive. No pre-download, no temp file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hexcrown" }]
keywords = ["usb", "iso", "flasher", "bootable-usb", "etcher-alternative"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Installation/Setup",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
zstd = ["zstandard>=0.22; python_version < '3.14'"]
dev = ["pytest>=8"]

[project.scripts]
pipeburn = "pipeburn.gui:main"
pipeburn-worker = "pipeburn.worker:main"

[project.urls]
Homepage = "https://github.com/Hexcrown/pipeburn"
Issues = "https://github.com/Hexcrown/pipeburn/issues"
Source = "https://github.com/Hexcrown/pipeburn"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeburn = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
